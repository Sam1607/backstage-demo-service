openapi: 3.0.0

info:
  title: Artist API
  description: Retrieve Artist Detail
  version: 1.0.0

servers:
  - url: https://example.com/api

paths:
  /artists/{id}:
    get:
      summary: Retrieve Artist Detail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Artist details
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  genre:
                    type: string
        '404':
          description: Artist not found